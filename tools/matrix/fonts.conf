<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The render matrix's image (tools/matrix/Dockerfile): Georgia is drawn with Gelasio, its metric-compatible face. -->
<fontconfig>
  <alias binding="same">
    <family>Georgia</family>
    <prefer><family>Gelasio</family></prefer>
  </alias>
</fontconfig>
