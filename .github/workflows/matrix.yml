name: Render matrix

# NFR-6(a)'s cadence (Story 4.11): the full matrix nightly and on demand before a release; on every push, only the
# designs that push touched. ITS OWN WORKFLOW, and nothing waits on it (R-116, owner 2026-09-17): ci.yml's `deploy`
# keeps `needs: [check, rls]`, so a red matrix never holds the app's publish. The usual cause of a red matrix is a
# deliberate change whose remedy is the owner's approval of a re-baseline (docs/render-matrix.md) — and every category
# owner gate from Epic 9 on still requires it green, so the gate sits on the library, not on the app's front door.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *'   # nightly, 03:00 IST
  workflow_dispatch:
    inputs:
      designs:
        description: 'Only these designs, ids or whole categories (e.g. "a1/1 a17"); empty = every design'
        required: false
        default: ''

# one run at a time: a nightly and a push, or two pushes, would otherwise build the same image twice and race on the
# render-matrix-diffs artifact
concurrency:
  group: render-matrix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # a push can carry several commits: the diff runs from the push's `before` to its head
          fetch-depth: 0
      # WHICH DESIGNS THIS RUN PHOTOGRAPHS. Nightly and on demand: every one (MATRIX_DESIGNS empty). On a push: the
      # designs whose directory or baselines changed, the whole category when its content.json changed, and EVERY
      # design when a shared input changed — the runtime, the shim, the library's code and data, the canvas document's
      # readers, the harness itself, or the pins in package.json and the lockfile.
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "designs=${{ github.event.inputs.designs }}" >> "$GITHUB_OUTPUT"; echo "scope: ${{ github.event.inputs.designs || 'every design' }} (on demand)"; exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "designs=" >> "$GITHUB_OUTPUT"; echo "scope: every design"; exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          if printf '%s\n' "$changed" | grep -qE '^(packages/section-runtime/|packages/ghost-shim/|packages/library/(src|orbit-weekly|icons|strings|modules|contexts)/|tools/matrix/|apps/web/lib/(pilots|controls-review)\.ts$|apps/web/app/\(app\)/app/\(authed\)/pilots/|package\.json$|pnpm-lock\.yaml$|\.nvmrc$|\.github/workflows/matrix\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "designs=" >> "$GITHUB_OUTPUT"; echo "scope: every design (a shared input changed)"; exit 0
          fi
          designs="$(printf '%s\n' "$changed" | sed -nE 's#^packages/library/(designs|baselines)/([^/]+)/([0-9]+)/.*#\2/\3#p; s#^packages/library/designs/([^/]+)/content\.json$#\1#p' | sort -u | tr '\n' ' ')"
          if [ -z "${designs// /}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "scope: this push touched no design"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"; echo "designs=$designs" >> "$GITHUB_OUTPUT"; echo "scope: $designs"

      # the harness is the repository's own node_modules, mounted into the pinned image — installed only when something runs
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # CI never passes --update: the gate refuses it under CI, and a missing baseline fails rather than being written
      - if: steps.scope.outputs.run == 'true'
        run: bash tools/matrix/run-matrix-gate.sh
        env:
          MATRIX_DESIGNS: ${{ steps.scope.outputs.designs }}

      # the diff image of every failing case, for the owner's sampled review
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-matrix-diffs
          path: tools/matrix/test-results/
          if-no-files-found: ignore
