name: CI

on:
  push:
    branches: [main]

# The workflow reads; it never writes. Left unset it takes the repository default,
# which is the one token scope this story did not rule on.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # THE WHOLE HISTORY, because `story-board.py` below derives every story's phase from
          # `git log`'s `Story E.S - Phase` lines: on the default one-commit checkout the board it
          # regenerates — and then checks against itself — is built from one commit, so a malformed
          # phase line that turns the board red locally stayed green here (review of 3.9, 2026-09-11).
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # THE DOCUMENTATION GATE, AND IT RUNS FIRST (DW-21, Story 3.9). Until now it ran only in the
      # local pre-commit hook, so a commit from a clone that has not run
      # `git config core.hooksPath tools/hooks` — or any tool that commits directly — published
      # without it, and `story-board.py`'s self-check is what decides whether the owner ever SEES
      # an open question (R-83/R-84). Before `pnpm build` because a red gate should be cheap.
      # `ubuntu-latest` ships python3 and `doc-audit.py` imports stdlib only (os, re, sys,
      # subprocess, html, datetime), so there is nothing to install.
      #
      # THE BOARD IS REGENERATED FIRST, AND WITHOUT IT THIS JOB WOULD BE RED ON EVERY PUSH —
      # executed on a fresh clone of HEAD before it was written, not reasoned: STORY-BOARD.html
      # reads `git log`, the pre-commit hook stages it BEFORE the commit exists, so the committed
      # copy is one commit behind BY CONSTRUCTION (the post-commit hook fixes the working tree,
      # which CI does not have). Regenerating it here costs a second and leaves the gate checking
      # everything DW-21 actually named: the catalogue, INDEX.md, the tuple and inventory
      # derivations, and every sub-tool's own SELF-CHECK — `story-board.py` exits non-zero on a
      # question block that claims neither a ruling nor `_(awaiting the owner)_`, which is the one
      # that decides whether the owner sees it. Nothing is committed; the runner's tree is thrown
      # away. `--check` here only REPORTS — locally its sub-tools regenerate on the first failure
      # and the hook retries once and stages them, and in CI there is nothing to stage.
      - run: python3 tools/story-board.py
      - run: python3 tools/doc-audit.py --check
      - run: pnpm check
      - run: pnpm build

  # The database gate (AD-26). It keys on the exit code, not on the log: every assertion in
  # supabase/tests/rls.sql aborts the run when it fails, so a red job is a real RLS hole.
  # docker is preinstalled on the runner; the script brings its own postgres and psql.
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: bash supabase/tests/run-rls-gate.sh

  # Publishing happens here, not on the push (owner's ruling, 2026-09-05, DW-7). `needs` is the whole
  # point: a red `check` or a red `rls` means this job never runs, so a broken row-level-security
  # policy cannot reach production. Vercel's own documented mechanism — vercel pull/build/deploy from
  # CI — see "Deploying GitHub Projects with Vercel" -> Using GitHub Actions.
  deploy:
    needs: [check, rls]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

