/* ── machinery ─────────────────────────────────────────────────────────── */
const picks = new Map(), notes = new Map();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render() {
  const order = { critical: 0, high: 1, medium: 2, low: 3, held: 4 };
  const list = [...FINDINGS].sort((a, b) => (order[a.severity] ?? 9) - (order[b.severity] ?? 9));

  const tally = {};
  for (const f of FINDINGS) tally[f.severity] = (tally[f.severity] || 0) + 1;
  document.getElementById('counts').innerHTML =
    Object.entries(tally).map(([k, v]) =>
      `<span class="pill">${v} ${k === 'held' ? 'held up' : esc(k)}</span>`).join('') +
    `<span class="pill">${FINDINGS.filter(f => f.options?.length).length} need a decision</span>`;

  document.getElementById('findings').innerHTML = list.map(f => `
    <section class="card" id="card-${esc(f.id)}">
      <div class="head">
        <span class="sev ${esc(f.severity)}">${f.severity === 'held' ? 'held up' : esc(f.severity)}</span>
        <h2>${esc(f.id)} · ${esc(f.title)}</h2>
        ${f.area ? `<span class="tag">${esc(f.area)}</span>` : ''}
        ${f.status ? `<span class="tag">${esc(f.status)}</span>` : ''}
      </div>
      ${(f.actor || f.radius) ? `<p class="plain"><strong>${f.actor ? 'Who: ' + esc(f.actor) : ''}${f.actor && f.radius ? ' · ' : ''}${f.radius ? 'Reaches: ' + esc(f.radius) : ''}</strong></p>` : ''}
      <p class="plain">${esc(f.plain)}</p>
      ${f.analogy ? `<p class="plain" style="color:var(--muted)"><em>${esc(f.analogy)}</em></p>` : ''}
      ${f.evidence ? `<details><summary>How we know${f.ad ? ' · ' + esc(f.ad) : ''}</summary><pre>${esc(f.evidence)}</pre></details>` : ''}
      ${f.options?.length ? `<div class="opts">${f.options.map((o, i) => `
        <div class="opt ${o.recommended ? 'rec' : ''}" id="opt-${esc(f.id)}-${i}">
          <div class="body">
            <div class="lbl">${i + 1}. ${esc(o.label)}${o.recommended ? '<span class="recflag">recommended</span>' : ''}</div>
            ${o.why ? `<div class="why">${esc(o.why)}</div>` : ''}
          </div>
          <button class="pick" aria-pressed="false" data-f="${esc(f.id)}" data-i="${i}">Choose</button>
        </div>`).join('')}</div>` : ''}
      <textarea data-note="${esc(f.id)}" placeholder="Counter-question or a note on ${esc(f.id)} — optional, and it goes into the reply."></textarea>
    </section>`).join('');

  document.querySelectorAll('button.pick').forEach(b => b.onclick = () => {
    const { f, i } = b.dataset;
    if (picks.get(f) === +i) picks.delete(f); else picks.set(f, +i);
    document.querySelectorAll(`button.pick[data-f="${f}"]`).forEach(x => {
      const on = picks.get(f) === +x.dataset.i;
      x.setAttribute('aria-pressed', on);
      x.textContent = on ? 'Chosen' : 'Choose';
      x.closest('.opt').classList.toggle('sel', on);
    });
    document.getElementById('card-' + f).classList.toggle('done', picks.has(f));
    status();
  });
  document.querySelectorAll('textarea[data-note]').forEach(t =>
    t.oninput = () => { notes.set(t.dataset.note, t.value.trim()); status(); });
  status();
}

function status() {
  const need = FINDINGS.filter(f => f.options?.length).length;
  const q = [...notes.values()].filter(Boolean).length;
  document.getElementById('status').textContent =
    `${picks.size} of ${need} decided${q ? ` · ${q} question${q > 1 ? 's' : ''}` : ''}`;
}

function build() {
  const lines = ['Round 4 decisions:', ''];
  for (const f of FINDINGS) {
    const p = picks.get(f.id), n = notes.get(f.id);
    if (p === undefined && !n) continue;
    if (p !== undefined) {
      const o = f.options[p];
      lines.push(`${f.id} — option ${p + 1}: ${o.label}${o.recommended ? ' (your recommendation)' : ''}`);
    } else {
      lines.push(`${f.id} — no option chosen yet`);
    }
    if (n) lines.push(`   Q: ${n}`);
  }
  const undecided = FINDINGS.filter(f => f.options?.length && !picks.has(f.id) && !notes.get(f.id));
  if (undecided.length) {
    lines.push('', `Not yet decided: ${undecided.map(f => f.id).join(', ')}`);
  }
  lines.push('', 'Apply the chosen options. Answer any questions above before applying the ones they attach to.');
  return lines.join('\n');
}

document.getElementById('copy').onclick = async () => {
  const text = build(), btn = document.getElementById('copy');
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; }
  catch { show(text); btn.textContent = 'Select and copy below'; }
  setTimeout(() => btn.textContent = 'Copy my reply', 2200);
};
document.getElementById('show').onclick = () => show(build());
function show(text) {
  let el = document.getElementById('out');
  if (!el) { el = document.createElement('pre'); el.id = 'out';
    document.querySelector('.wrap').appendChild(el); }
  el.textContent = text;
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}
render();
</script>
