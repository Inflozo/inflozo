<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>app.js self-check</title>
<link rel="stylesheet" href="styles.css">
</head>
<!--
  The one runnable check behind app.js (F-016). Open it in a browser (double-click) — it drives
  exactly the hooks build-app.py attaches to the lifted screens, on a fixture shaped the way the
  frames are: an overlay raised by a non-native trigger, a pick group whose looks live in inline
  styles, the wizard's step jump, a drawn href="#" anchor, and the WCAG 2.1.4 typing guard.
  Green is pass. Not a test framework, on purpose.
-->
<body class="product" data-editor-shell data-keys="]:#next,p:#preview" style="padding:32px;font-family:var(--ui)">
<h1 style="font-size:22px;font-family:var(--display)">app.js self-check</h1>
<p class="softaa" style="font-size:13px;margin:8px 0 20px">Drives overlays (open, trap, close, return), pick groups,
  the wizard rail, the '#' no-op and the typing guard against a minimal fixture. Green is pass.</p>
<ol id="out" style="font-size:13px;line-height:1.9"></ol>

<div hidden>
  <!-- fixture: a lifted overlay, raised by a div the frame drew (trigger() adds the keyboard attributes) -->
  <div data-open="sheet" id="raise" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false">open</div>
  <div id="sheet" class="overlay sheet-lifted" style="display:flex">
    <h3>Delete your account?</h3>
    <input id="typed" type="text" data-typed="delete my account" data-typed-target="#go">
    <button id="cancel" data-close>Cancel</button>
    <button id="go">Delete account</button>
  </div>

  <!-- fixture: the lifted idiom — a pick group whose looks live in inline styles, B drawn selected -->
  <span data-pick="seg" id="opt-a" role="tab" tabindex="-1" aria-selected="false" style="background:none;font-weight:500">A</span>
  <span data-pick="seg" id="opt-b" role="tab" tabindex="0" aria-selected="true" data-picked style="background:#FFFFFF;font-weight:600">B</span>
  <span data-pick="seg" id="opt-c" role="tab" tabindex="-1" aria-selected="false" style="background:none;font-weight:500">C</span>

  <!-- fixture: a drawn href="#" anchor -->
  <a href="#" id="hash">Changelog →</a>

  <!-- fixture: the wizard -->
  <div data-wizard data-at="1" id="wiz">
    <div data-step="1" data-step-title="Step one" tabindex="-1">one</div>
    <div data-step="2" data-step-title="Step two" tabindex="-1" hidden>two</div>
    <button data-goto="2" id="tostep2">go</button>
  </div>

  <!-- fixture: a text field, for the typing guard -->
  <input id="field" type="text">
</div>

<script src="app.js"></script>
<script>
window.addEventListener('load', function () {
  var out = document.getElementById('out'), fails = 0;
  function check(name, ok) {
    fails += ok ? 0 : 1;
    out.insertAdjacentHTML('beforeend',
      '<li style="color:' + (ok ? 'var(--mint-text)' : 'var(--danger)') + '">'
      + (ok ? '✓ ' : '✕ ') + name + '</li>');
  }
  var $ = function (s) { return document.querySelector(s); };
  function key(k, opts) {
    var o = opts || {}; o.key = k; o.bubbles = true;
    (o.target || document.activeElement || document).dispatchEvent(new KeyboardEvent('keydown', o));
  }
  document.querySelector('div[hidden]').hidden = false;   // the fixture must be visible to take focus

  // 1 · an overlay opens from its trigger, names itself, and takes focus
  var sheet = $('#sheet');
  check('a lifted overlay starts closed despite its inline display:flex', getComputedStyle(sheet).display === 'none');
  $('#raise').focus();
  key('Enter', { target: $('#raise') });
  check('Enter on a role=button trigger opens it', getComputedStyle(sheet).display === 'flex');
  check('it is a dialog', sheet.getAttribute('role') === 'dialog' && sheet.getAttribute('aria-modal') === 'true');
  check('it is named from its heading', sheet.getAttribute('aria-label') === 'Delete your account?');
  check('the trigger reports expanded', $('#raise').getAttribute('aria-expanded') === 'true');
  check('focus moved in', sheet.contains(document.activeElement));

  // 2 · Tab is trapped inside it, both ways
  $('#go').focus();
  key('Tab');
  check('Tab from the last control wraps to the first', document.activeElement === $('#typed'));
  key('Tab', { shiftKey: true });
  check('Shift-Tab from the first wraps to the last', document.activeElement === $('#go'));

  // 3 · the typed confirm blocks until the phrase is exact
  check('the destructive button starts blocked', $('#go').getAttribute('aria-disabled') === 'true');
  $('#typed').value = 'delete my account'; $('#typed').dispatchEvent(new Event('input', { bubbles: true }));
  check('the exact phrase unblocks it', $('#go').getAttribute('aria-disabled') === 'false');

  // 4 · Esc closes it and focus returns to the trigger
  key('Escape');
  check('Esc closes it', getComputedStyle(sheet).display === 'none');
  check('focus returns to the trigger', document.activeElement === $('#raise'));
  check('the trigger reports collapsed', $('#raise').getAttribute('aria-expanded') === 'false');
  $('#raise').click();
  $('#cancel').click();
  check('the drawn Cancel closes it too', getComputedStyle(sheet).display === 'none');

  // 5 · picking in the frames' idiom: the selected LOOK is the one that was drawn, and it was on B
  check('the drawn selection starts on B', $('#opt-b').style.fontWeight === '600' && $('#opt-a').style.fontWeight === '500');
  $('#opt-a').click();
  check('A takes the drawn selected look', $('#opt-a').style.background === 'rgb(255, 255, 255)' && $('#opt-a').getAttribute('aria-selected') === 'true');
  check('B drops back to the resting look', $('#opt-b').style.fontWeight === '500' && $('#opt-b').getAttribute('aria-selected') === 'false');
  $('#opt-a').focus();
  key('ArrowRight', { target: $('#opt-a') });
  check('ArrowRight moves the pick to B', $('#opt-b').style.fontWeight === '600' && document.activeElement === $('#opt-b'));

  // 6 · a drawn href="#" is a no-op, never a jump to the top
  window.scrollTo(0, 40);
  var y = window.scrollY;
  $('#hash').click();
  check('href="#" does not move the page', window.scrollY === y && location.hash === '');

  // 7 · the wizard moves, announces the step's title and focuses the step
  check('wizard boots on step 1', !$('[data-step="1"]').hidden && $('[data-step="2"]').hidden);
  $('#tostep2').click();
  check('it advances to step 2', !$('[data-step="2"]').hidden && $('[data-step="1"]').hidden);
  check('focus moves to the step', document.activeElement === $('[data-step="2"]'));

  // 8 · page-level keys are inert inside a text field (WCAG 2.1.4) and live outside it
  var navigated = null;
  document.addEventListener('keydown', function (e) { if (e.defaultPrevented) navigated = e.key; });
  $('#field').focus();
  key(']', { target: $('#field') });
  check('] inside a text field does nothing', navigated === null);
  $('#field').blur(); document.body.focus();
  var stop = function (e) { if (e.key === ']' && e.defaultPrevented) e.stopImmediatePropagation(); };
  // app.js would navigate on ']' — the fixture's target is a fragment, so the location stays here
  key(']', { target: document.body });
  setTimeout(function () {
    check('] outside a text field is handled', location.hash === '#next');
    document.title = fails ? fails + ' FAILED' : 'ALL PASS';
    out.insertAdjacentHTML('afterend',
      '<p style="margin-top:18px;font-weight:600;font-size:15px;color:'
      + (fails ? 'var(--danger)' : 'var(--mint-text)') + '">' + document.title + '</p>');
  }, 50);
});
</script>
</body>
</html>
