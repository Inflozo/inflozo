<div id="live-polite" aria-live="polite" class="sr-only"></div>

        <div style="position:absolute;inset:0;background:rgba(28,27,26,.4)"></div>
        <div style="width:460px;background:#FFFFFF;border-radius:16px;box-shadow:0 12px 40px rgba(28,27,26,.25);padding:26px;display:flex;flex-direction:column;gap:18px;position:relative">

            <div style="display:flex;flex-direction:column;gap:4px">
              <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;letter-spacing:-0.01em">Delete your account?</span>
              <span style="font-size:13px;color:#6E6A64;line-height:1.5">All 6 projects, their full version history and 48 assets will be permanently deleted. Your live Ghost sites stay online. This cannot be undone.</span>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">

            <input type="text" value="delete my acc" style="height:40px;border:1px solid #E5484D;border-radius:8px;padding:0 12px;font-family:'JetBrains Mono',monospace;font-size:13px;background:#FFFFFF;color:#1C1B1A;outline:none;caret-color:#E5484D;box-shadow:0 0 0 2px rgba(229,72,77,.25)">
          </div>
          <div style="display:flex;gap:10px;justify-content:flex-end">
            <button style="height:38px;padding:0 16px;background:#FFFFFF;border:1px solid #E7E2DB;border-radius:12px;font-size:13px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;transition:background 160ms ease-out" style-hover="background:#F7F5F2">Cancel</button>
            <button style="height:38px;padding:0 18px;background:#C4383C;color:#FFFFFF;border:none;border-radius:12px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;opacity:.45">Delete account</button>
