# .npmrc carries engine-strict for npm's readers; pnpm 11 reads its own settings here.
engineStrict: true

packages:
  - 'apps/*'
  - 'packages/*'

# dtrace-provider is bunyan's optional native DTrace binding, reached through gscan's
# logger. Nothing here traces, so its build script never runs.
allowBuilds:
  dtrace-provider: false

# @supabase/ssr 0.12.6 was published 2026-09-04 11:05Z (`npm view @supabase/ssr time`), under a
# day before Story 1.4 pinned it, and pnpm 11's minimum-release-age gate refused it at install.
# Drop this line when the pin moves on.
minimumReleaseAgeExclude:
  - '@supabase/ssr@0.12.6'

# Story 7.16a — the Routes Manager's test-only NQL pins are Ghost's own: 6.58.0 resolves @tryghost/nql 0.13.4 over
# nql-lang 0.7.0 (its pnpm-lock.yaml), and 5.130.6 resolves nql 0.12.7 over nql-lang 0.6.3 (its yarn.lock), where the
# alias `nql5` would otherwise float to 0.6.x's newest. Test-only: `packages/section-runtime`'s devDependencies.
overrides:
  '@tryghost/nql@0.12.7>@tryghost/nql-lang': 0.6.3

patchedDependencies:
  jsdom@30.0.1: patches/jsdom@30.0.1.patch
