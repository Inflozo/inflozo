<header class="a1-1" data-bg="base" data-spacing="comfortable" data-divider="none"
        data-on-scroll="shrink" data-nav-position="beside" data-sign-in="on" data-subscribe="on"
        data-divider-under="hairline" data-nav-before-more="4">
  <div class="a1-1__bar" data-module="nav-drawer">
    <a class="a1-1__brand" data-bind-attr="href:@site.url">
      <img class="a1-1__logo" data-if="@site.logo" data-bind-attr="src:@site.logo;alt:@site.title" alt="">
      <span class="a1-1__wordmark" data-else data-bind="@site.title" data-empty="hide">Orbit Weekly</span>
    </a>
    <nav class="a1-1__nav" data-t-attr="aria-label:a11y.main_navigation">
      <div class="a1-1__items" data-helper="navigation"></div>
      <details class="a1-1__more">
        <summary class="a1-1__more-trigger" data-t="nav.more">More</summary>
        <div class="a1-1__panel" data-helper="navigation"></div>
      </details>
    </nav>
    <div class="a1-1__actions">
      <a class="a1-1__signin" data-members="free" data-t="member.account" data-prop-attr="href:accountUrl">Account</a>
      <a class="a1-1__signin" data-members="paid" data-t="member.account" data-prop-attr="href:accountUrl">Account</a>
      <span class="a1-1__ask" data-if="@site.allow_self_signup">
        <a class="a1-1__signin" data-members="anonymous" data-t="member.signin_cta" data-prop-attr="href:signInUrl">Sign in</a>
        <a class="a1-1__cta" data-members="anonymous" data-prop="ctaLabel" data-prop-attr="href:ctaUrl">Subscribe</a>
      </span>
    </div>
    <button class="a1-1__menu" type="button" aria-expanded="false" data-t-attr="aria-label:a11y.open_menu"><span class="a1-1__menu-bar"></span><span class="a1-1__menu-bar"></span></button>
  </div>
</header>
