# Inflozo TEAM overrides for bmad-build (committed; the .user.toml layer is personal and gitignored) — the owner's rulings R-80 to R-84 (2026-09-04), bound where the
# work happens rather than remembered. Merge rules: scalars override, arrays append, tables keyed by id
# append a new entry. `docs/project-context.md` is already loaded as a persistent fact by the base
# customize.toml; the lines below are the parts that must be STEPS, not facts.

[workflow]

activation_steps_append = [
  "State the four rules you are bound by before the first plan step, in one line each, so the owner sees them: (1) commit and push to main after every phase with the message `Story <epic>.<story> - <Phase> - <one line>` (R-81); (2) review and test on the real infrastructure with the keys in tools/probe/.env, never mocks alone (R-82); (3) every question to the owner is plain English with an example, numbered options and one marked (RECOMMENDED) (R-83); (4) a story with a screen carries `## In plain English`, `## Owner's manual test` and names its frame (R-74, R-80).",
  "When the spec is created or amended, make sure it carries `## In plain English` (three sentences a non-engineer reads: what the user can now do, and what they will see), `## Owner's manual test` for any story with a screen (numbered steps: URL · screen · what to do · dummy data · what should be seen), and `## Questions for the owner` only when a decision is genuinely his. Add `owner_test: pending` to the frontmatter of any story with a screen.",
]

on_complete = """
Before you end, in this order and without asking:
1. Regenerate the story board: `python3 {project-root}/tools/story-board.py`.
2. Run the gate twice: `python3 {project-root}/tools/doc-audit.py --check` (its sub-tools regenerate on the first failure); if it is red after the second run, fix the cause — never push a red gate.
3. Commit and push to main with the one-line message `Story <epic>.<story> - <Phase> - <one line about the story>`, where Phase is the phase this run completed (Create · Dev · Review · Deploy · Test · Fix · Done). Show the commit hash to the owner.
4. If `## Questions for the owner` in the spec has any open question, repeat it in the summary exactly as R-83 requires: plain English, an example, numbered options, one marked (RECOMMENDED).
"""

[[workflow.review_layers]]
id = "real-infra-verifier"
name = "Real-infra verifier"
instruction = """
Launch a context-free subagent with this prompt:
You are verifying a story of Inflozo against the REAL infrastructure, never mocks alone (owner's ruling R-82).
Read `{project-root}/docs/project-context.md` first. The keys are in `{project-root}/tools/probe/.env` (never print or commit one).
Read the spec at {spec_file}: its `## Verification` section must name the real endpoints, sites or services the story touches — Supabase, Vercel, Resend, Dodo, the Ghost test servers T1 ghost6.inflozo.com and T3 ghost5.inflozo.com — and what each returned.
Execute what the spec claims: run its verification commands or tests against those real services and record the command and its output. A result whose control did not pass is not a result — include one negative control.
Report as a Markdown list: each claim, whether it held on the real infrastructure, and the evidence. If the spec's Verification names no real service for a story that reads or writes one, report that as a finding of its own — the review cannot pass on mocks.
Review content for context:
{diff_output}
Do not invoke any skill. Return only the review result.
"""
