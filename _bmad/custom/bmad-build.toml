# Inflozo TEAM overrides for bmad-build (committed; the .user.toml layer is personal and gitignored).
# The owner's rulings R-80 to R-84 (2026-09-04), bound where the work happens rather than remembered.
# Merge rules: scalars override, arrays append, tables keyed by id append a new entry.
# `docs/project-context.md` is already loaded as a persistent fact by the base customize.toml; the
# entries below are the parts that must be STEPS the skill executes, not facts it carries.

[workflow]

activation_steps_append = [
  "State the four rules you are bound by before the first plan step, in one line each, so the owner sees them: (1) commit and push to main after every phase with the message `Story <epic>.<story> - <Phase> - <one line>` (R-81); (2) review and test on the real infrastructure with the keys in tools/probe/.env, never mocks alone (R-82); (3) every question to the owner is plain English with an example, numbered options and one marked (RECOMMENDED) (R-83); (4) a story with a screen carries `## In plain English`, `## Owner's manual test` and names its frame (R-74, R-80).",
  "PHASES ARE SEPARATE RUNS, and the owner's instruction in the invocation decides where this run stops (R-81 — one commit per phase). If the invocation says CREATE THE SPEC ONLY: at CHECKPOINT 1, when the spec is approved, set its status to `ready-for-dev`, run the On Complete block with Phase `Create`, and stop — do not load step-03. If it says IMPLEMENT: after step-03's Tasks & Acceptance verification, run On Complete with Phase `Dev` and stop — do not load step-04; the Review phase is its own run of /bmad-code-review. If it says FIX: implement the findings, then On Complete with Phase `Fix` and stop. A story from epics.md always takes the plan → code → review route; never the one-shot route.",
  "THE SPEC CARRIES THE OWNER'S SECTIONS AND THEY SURVIVE EVERY REWRITE. When the spec is created or amended, make sure it carries `## In plain English` (three sentences a non-engineer reads: what the user can now do, and what they will see), `## Owner's manual test` for any story with a screen (numbered steps, each with the URL, the screen, what to do, the dummy data to type if any, and what should be seen), and `## Questions for the owner` only when a decision is genuinely his. Frontmatter carries `owner_test: pending` for a story with a screen and `owner_test: none` for one without. When you rewrite an existing spec (a resumed draft, a loopback), carry over verbatim every frontmatter key and every `##` or `###` section the template does not define — `owner_test`, `baseline_commit`, `review_loop_iteration`, `## Questions for the owner` with any `Ruled:` line, `## Owner's manual test`, `## Owner's test findings`.",
  "EVERY COMMIT THIS RUN MAKES — step-05's own included — uses the R-81 message shape `Story <epic>.<story> - <Phase> - <one line>`, and the push in On Complete is the owner's standing instruction: it overrides the skill's `NEVER auto-push`. Before any HALT that would ask the owner something, write the question under `## Questions for the owner` in R-83 shape (plain English, an example, numbered options, one marked (RECOMMENDED)), regenerate the story board, and commit and push `Story <epic>.<story> - Blocked - <five words>` so the board shows it; put the skill's own menus to the owner in that shape too.",
  "In E9 and E10 — the shell block and the gated library — a category is a run of consecutive one-session stories (R-85): refuse to plan a story unless the previous story in that epic — as sprint-status.yaml orders them, which is the story numbers' order except where R-196 runs Story 10.112 straight after 10.58 — is `done` in sprint-status.yaml, because that `done` is the owner's test of it; the last story of a category is §4's owner gate and its `## Verification` lists §4's automated sheet across the whole category as commands with expected results.",
]

open_spec = ""

on_complete = """
Before you end, in this order and without asking:
1. Regenerate the story board: `python3 {project-root}/tools/story-board.py`.
2. Run the gate twice: `python3 {project-root}/tools/doc-audit.py --check` (its sub-tools regenerate on the first failure); if it is red after the second run, fix the cause — never push a red gate. A new file under tools/ or docs/ or planning-artifacts/ needs a row in tools/doc-audit.py's catalogue.
3. Commit and push to main with the one-line message `Story <epic>.<story> - <Phase> - <one line about the story>`, where Phase is the phase this run completed (Schema · Create · Dev · Review · Deploy · Test · Fix · Done · Blocked). R-99: if the story changes the database, the migration is pushed FIRST as `Schema`, on its own, BEFORE the Dev push — CI publishes on every push while the migration is applied by hand, so code that ships first breaks production until Deploy. Show the commit hash to the owner.
4. If `## Questions for the owner` in the spec has any question that is still OPEN, repeat it in the summary exactly as R-83 requires: plain English, an example, numbered options, one marked (RECOMMENDED). A question is OPEN until the owner rules it, and the board reads that state rather than inferring it: a ruling carries his signature and the date — `**Ruled: option 1 (owner, 2026-09-09).**` — and a question still his carries the token `**Ruled:** _(awaiting the owner)_`. A block that claims a ruling with neither mark FAILS the gate rather than being guessed at (`tools/story-board.py`).
"""

[[workflow.review_layers]]
id = "real-infra-verifier"
name = "Real-infra verifier"
instruction = """
Launch a context-free subagent with this prompt:
You are verifying a story of Inflozo against the REAL infrastructure, never mocks alone (owner's ruling R-82).
Read `{project-root}/docs/project-context.md` first. The keys are in `{project-root}/tools/probe/.env`: read a key only into a command's environment (for example `env $(grep '^GHOST6_' tools/probe/.env | xargs) python3 …`), never cat, echo, printenv or print one, and record every command with the key's variable name, never its value; strip Authorization headers and connection strings from any output you record.
Read the spec at {spec_file}: its `## Verification` section must name the real endpoints, sites or services the story touches — Supabase, Vercel, Resend, Dodo, the Ghost test servers T1 ghost6.inflozo.com and T3 ghost5.inflozo.com — and what each returned.
Execute what the spec claims: run its verification commands or tests against those real services and record the command and its output. A result whose control did not pass is not a result — include one negative control.
Report as a Markdown list: each claim, whether it held on the real infrastructure, and the evidence. If the spec's Verification names no real service for a story that reads or writes one, report that as a finding of its own — the review cannot pass on mocks.
Review content for context:
{diff_output}
Do not invoke any skill. Return only the review result.
"""
