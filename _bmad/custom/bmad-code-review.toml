# Inflozo TEAM overrides for bmad-code-review (committed; the .user.toml layer is personal and gitignored).
# A review of a story runs on the real infrastructure (R-82), never marks the story done (R-80 — Done is
# the owner's, written by the Record prompt), and ends with a commit and push (R-81). 2026-09-04.

[workflow]

activation_steps_append = [
  "You are bound by docs/project-context.md: the review runs against the real infrastructure with the keys in tools/probe/.env, never mocks alone, and never prints or records a key's value (R-82); every finding that needs the owner's decision is written under `## Questions for the owner` in the spec in plain English with an example, numbered options and one marked (RECOMMENDED) (R-83); A CLEAN REVIEW NEVER SETS THE STORY TO `done` — leave the spec `in-review` (or `in-progress` if patches stay open) and do not write `done` to sprint-status.yaml: Deploy and the owner's test follow, and the Record prompt alone writes Done (R-80). At the skill's menus: proceed, apply every patch, done. When the review is recorded, commit and push to main as `Story <epic>.<story> - Review - <one line>` (R-81).",
]

on_complete = """
Before you end: `python3 {project-root}/tools/story-board.py`, then `python3 {project-root}/tools/doc-audit.py --check` twice, then commit and push to main as `Story <epic>.<story> - Review - <one line about what the review found>`. Never push a red gate. If `## Questions for the owner` has any question that is still OPEN, repeat it in the summary in R-83 shape. A question is OPEN until the owner rules it, and the board reads that state rather than inferring it: a ruling carries his signature and the date — `**Ruled: option 1 (owner, 2026-09-09).**` — and a question still his carries the token `**Ruled:** _(awaiting the owner)_`. A block that claims a ruling with neither mark FAILS the gate rather than being guessed at (`tools/story-board.py`).
"""

[[workflow.review_layers]]
id = "real-infra-verifier"
name = "Real-infra verifier"
instruction = """
Launch a context-free subagent with this prompt:
You are verifying a story of Inflozo against the REAL infrastructure, never mocks alone (owner's ruling R-82).
Read `{project-root}/docs/project-context.md` first. The keys are in `{project-root}/tools/probe/.env`: read a key only into a command's environment, never cat, echo, printenv or print one, and record every command with the key's variable name, never its value; strip Authorization headers and connection strings from any output you record.
Read the spec at {spec_file}: its `## Verification` section must name the real endpoints, sites or services the story touches — Supabase, Vercel, Resend, Dodo, the Ghost test servers T1 ghost6.inflozo.com and T3 ghost5.inflozo.com — and what each returned.
Execute what it claims against those real services and record the command and its output, with one negative control. Report as a Markdown list: each claim, whether it held, and the evidence. If Verification names no real service for a story that reads or writes one, report that as a finding — the review cannot pass on mocks.
Review content for context:
{diff_output}
Do not invoke any skill. Return only the review result.
"""
